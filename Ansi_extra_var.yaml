---
- name: create file
  hosts: server2.example.com
  tasks:
  - name: Creating an empty file
    file:
      path: "/tmp/{{ deploy }}.txt"
      state: touch
      mode: '0644'
  - name: Display file created
    shell: ls -lrt /tmp
    register: command_output
  - name: Show file created
    debug:
      msg: "{{ command_output.stdout }}"
  - name: uname
    shell: uname
    register: command
  - name: Display hostname
    debug:
      msg: "{{ command.stdout }}"
    
